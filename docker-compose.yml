services:
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  users-service:
    build:
      context: ./users-service
    container_name: users_service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  notifications-service:
    build:
      context: ./notifications-service
    container_name: notifications_service
    ports:
      - "8082:8082"
    restart: unless-stopped

  game-store-service:
    build:
      context: ./game-store-service
    container_name: game_store_service
    volumes:
      - user_uploads:/data/uploads
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    depends_on:
      db:
        condition: service_healthy
      notifications-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: bloodfox_frontend
    ports:
      - "3000:80"
    depends_on:
      - game-store-service
    restart: unless-stopped

volumes:
  db_data:
  user_uploads:
